openapi: 3.0.3
info:
  title: BT-03 Ukiyo-e API
  version: 1.0.0
servers:
  - url: http://127.0.0.1:3101
paths:
  /api/health:
    get:
      responses:
        '200': {description: Database and Redis healthy}
  /api/images:
    get:
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
      responses:
        '200': {description: Fifty newest images and pagination metadata}
  /api/images/search:
    get:
      parameters:
        - {name: q, in: query, required: true, schema: {type: string}}
      responses:
        '200': {description: Existing image}
        '202': {description: Queued or active generation job}
  /api/images/{id}:
    get:
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Image metadata}
        '404': {description: Missing image}
  /api/images/{id}/file:
    get:
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: PNG image}
  /api/stats:
    get:
      responses:
        '200': {description: Counts, queue state and worker metrics}
  /api/workers:
    get:
      responses:
        '200': {description: Worker list}
  /api/workers/{id}:
    get:
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Worker state}
  /api/generation/jobs:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description]
              properties: {description: {type: string}}
      responses:
        '202': {description: Generation job}
  /api/generation/jobs/{id}:
    get:
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Job status and resulting image}
  /api/events:
    get:
      parameters:
        - {name: jobId, in: query, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Server-Sent Events for job or gallery}
  /api/scheduler/pause:
    post:
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Scheduler paused}
  /api/scheduler/resume:
    post:
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Scheduler resumed}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
