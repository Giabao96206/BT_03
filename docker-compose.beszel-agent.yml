name: bt03-agent
services:
  beszel-agent:
    image: henrygd/beszel-agent:0.21.2
    restart: unless-stopped
    network_mode: host
    env_file: .env.beszel-agent
    environment:
      # Local-only SSH listener; metrics are sent through an outgoing WebSocket.
      LISTEN: "127.0.0.1:45876"
      SKIP_SYSTEMD: "true"
    volumes:
      - agent_data:/var/lib/beszel-agent
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 128m
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  agent_data:
